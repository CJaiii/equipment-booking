<body>

<script>
// All API calls go through /api/proxy — no CORS issues
async function apiCall(action, body, ms=15000){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),ms);
  try{
    const r=await fetch('/api/proxy?action='+action,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body||{}),
      signal:ctrl.signal,
    });
    clearTimeout(timer);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const txt=await r.text();
    return txt?JSON.parse(txt):null;
  }catch(e){clearTimeout(timer);throw e;}
}

const ENGINEERS=[
  {name:"Л.Далайжаргал",title:"Сайт менежер"},
  {name:"Б.Далайжаргал",title:"Цахилгааны ахлах инженер"},
  {name:"А.Баянмэнх",title:"Сантехникийн ахлах инженер"},
  {name:"Ж.Дондовдорж",title:"Сантехникийн инженер"},
  {name:"П.Дарханчимэг",title:"Талбайн ахлах инженер"},
  {name:"П.Мэнх-Эрдэнэ",title:"Блок инженер"},
  {name:"Г.Батням",title:"Блок хариуцсан инженер"},
  {name:"Д.Сарангэрэл",title:"Блок хариуцсан инженер"},
  {name:"Э.Оюунбаяр",title:"Ашиглалтын инженер"},
  {name:"С.Мягмарсүрэн",title:"Талбайн няравч"},
  {name:"Б.Батчимэг",title:"Гадна тохижилтийн ахлах инженер"},
  {name:"Б.Болдсайхан",title:"Гадна тохижилтийн инженер"},
  {name:"Б.Хосбаяр",title:"Зам талбайн инженер"},
  {name:"Р.Мэнжаргал",title:"Талбайн инженер"},
  {name:"Г.Оргил",title:"Талбайн инженер"},
  {name:"Г.Уламбадрах",title:"Сантехникийн инженер"},
  {name:"О.Эрдэнэхуяг",title:"Талбайн няравч"},
  {name:"Е.Халиун",title:"Талбайн ахлах инженер"},
  {name:"Б.Чимэддорж",title:"Талбайн инженер"},
  {name:"К.Элшин",title:"Талбайн инженер"},
  {name:"Б.Мэнхзориг",title:"Нягтлан бодогч"},
];
const EQUIPMENT=[
  {id:"Экскаватор-300",type:"Экскаватор"},{id:"Экскаватор-210",type:"Экскаватор"},
  {id:"Экскаватор-120",type:"Экскаватор"},{id:"Экскаватор-55",type:"Экскаватор"},
  {id:"Авто кран-50 тн",type:"Авто кран"},{id:"Авто кран-25 тн",type:"Авто кран"},
  {id:"Ховш",type:"Тээвэр"},{id:"Ковш",type:"Тээвэр"},
  {id:"Индүү 10 тн",type:"Индүү"},{id:"Индүү 5 тн",type:"Индүү"},{id:"Индүү 2 тн",type:"Индүү"},
  {id:"Шалаанс",type:"Бусад"},
];
const ZONES=["2-р ээлж / Гараж B,G","2-р ээлж / Үйлчилгээ F","2-р ээлж / Блок 201","2-р ээлж / Блок 202","2-р ээлж талбай","5-р ээлж / Гараж F,G","5-р ээлж / Үйлчилгээ C,D","5-р ээлж / Блок 502","5-р ээлж / Блок 503","5-р ээлж талбай","ТомЕ Сургууль өргөтгөл"];
const LS_KEY='moncon-eq-v2';

let bookings=[],weekOffset=0,currentView='schedule',chatHistory=[],isOnline=false;

function lsLoad(){try{const d=localStorage.getItem(LS_KEY);return d?JSON.parse(d):[]}catch(e){return[]}}
function lsSave(d){try{localStorage.setItem(LS_KEY,JSON.stringify(d))}catch(e){}}
function setBadge(t,c){const b=document.getElementById('storage-badge');if(b){b.textContent=t;b.style.color=c;b.style.borderColor=c;b.style.background='rgba(4,138,129,.15)';}}
function showBanner(v){document.getElementById('conn-banner').classList.toggle('show',v);}

async function loadBookings(){
  setBadge('⟳ Ачааллаж...','#04c8b9');
  try{
    const data=await apiCall('GET',{},12000);
    const items=(data&&data.value)?data.value:[];
    bookings=items.map(i=>({
      id:i.ID||i.id,
      engineer:i.Engineer?.Value||i.Engineer||'',
      equipment:i.Equipment?.Value||i.Equipment||'',
      zone:i.Zone?.Value||i.Zone||'',
      dateStart:i.DateStart?i.DateStart.split('T')[0]:'',
      dateEnd:i.DateEnd?i.DateEnd.split('T')[0]:'',
      timeStart:i.DateStart&&i.DateStart.length>10?i.DateStart.substring(11,16):'08:00',
      timeEnd:i.DateEnd&&i.DateEnd.length>10?i.DateEnd.substring(11,16):'17:00',
      description:i.Description||i['Нэмэлт Тайлбар']||'',
      status:i.Status?.Value||i.Status||'Хүлээгдэж буй',
    }));
    lsSave(bookings);isOnline=true;
    setBadge('✓ SharePoint live','#04c8b9');showBanner(false);
  }catch(e){
    bookings=lsLoad();isOnline=false;
    setBadge('⚠ Офлайн ('+bookings.length+')','#BA7517');showBanner(true);
    console.warn('Load error:',e.message);
  }
}

async function retryConnect(){showBanner(false);await loadBookings();renderCurrent();}

async function createBooking(b){
  if(isOnline){
    await apiCall('POST',{Title:'BK-'+Date.now(),Engineer:b.engineer,Equipment:b.equipment,Zone:b.zone,DateStart:b.dateStart+'T'+b.timeStart+':00Z',DateEnd:b.dateEnd+'T'+b.timeEnd+':00Z',Description:b.description,Status:b.status,WeekNumber:getISOWeek(new Date(b.dateStart))});
    await loadBookings();
  }else{bookings.push({...b,id:'tmp-'+Date.now()});lsSave(bookings);}
}
async function deleteBookingById(id){
  if(isOnline){await apiCall('DELETE',{itemId:id});await loadBookings();}
  else{bookings=bookings.filter(b=>b.id!=id);lsSave(bookings);}
}
async function updateStatus(id,status){
  if(isOnline){await apiCall('UPDATE',{itemId:id,status});await loadBookings();}
  else{const b=bookings.find(b=>b.id==id);if(b)b.status=status;lsSave(bookings);}
}

function getMonday(o){const d=new Date();const day=d.getDay();d.setDate(d.getDate()-day+(day===0?-6:1)+o*7);d.setHours(0,0,0,0);return d;}
function addD(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function fmtISO(d){return d.toISOString().split('T')[0];}
function fmtDate(d){return d.toLocaleDateString('mn-MN',{month:'short',day:'2-digit'});}
function getISOWeek(d){const t=new Date(d);t.setDate(t.getDate()+4-(t.getDay()||7));const y=new Date(t.getFullYear(),0,1);return Math.ceil(((t-y)/86400000+1)/7);}
function getWeekDays(o){const m=getMonday(o);return Array.from({length:7},(_,i)=>addD(m,i));}

function initEngDropdown(){
  const sel=document.getElementById('eng-global');
  sel.innerHTML='<option value="">Инженер сонгох...</option>'+ENGINEERS.map(e=>`<option value="${e.name}">${e.name}</option>`).join('');
}
function onEngChange(){const v=document.getElementById('eng-global').value;document.getElementById('eng-av').textContent=v?v.charAt(0):'?';renderCurrent();}
function show(v){currentView=v;['schedule','book','list','ai'].forEach(t=>document.getElementById('tab-'+t).classList.toggle('active',t===v));renderCurrent();}
function renderCurrent(){
  const ca=document.getElementById('content');
  if(currentView==='schedule')ca.innerHTML=buildSchedule();
  else if(currentView==='book')ca.innerHTML=buildBook();
  else if(currentView==='list')ca.innerHTML=buildList();
  else if(currentView==='ai')ca.innerHTML=buildAI();
  postRender();
}

function buildSchedule(){
  const days=getWeekDays(weekOffset);const todayISO=fmtISO(new Date());
  const dayNames=['Да','Мя','Лх','Пү','Ба','Бя','Ня'];
  const eng=document.getElementById('eng-global')?.value||'';
  const wn=getISOWeek(days[0]);
  let h=`<div class="sch-wrap"><div class="week-bar">
    <div class="week-title">${wn}-р долоо хоног · ${fmtDate(days[0])} – ${fmtDate(days[6])}</div>
    <div class="week-controls">
      <div class="legend"><div class="leg"><div class="leg-dot" style="background:#D4EDDA"></div>Захиалагдсан</div><div class="leg"><div class="leg-dot" style="background:#D1ECF1;outline:2px solid #048A81"></div>Миний</div><div class="leg"><div class="leg-dot" style="background:#FFF3CD"></div>Олон</div></div>
      <button class="wn-btn" onclick="weekOffset--;renderCurrent()">‹</button>
      <span class="wn-lbl">${fmtDate(days[0])} – ${fmtDate(days[6])}</span>
      <button class="wn-btn" onclick="weekOffset++;renderCurrent()">›</button>
      <button class="refresh-btn" onclick="doRefresh()">↻ Шинэчлэх</button>
    </div></div>
  <div class="grid-outer"><div class="grid-head"><div class="gh-eq">Техник</div>`;
  for(let i=0;i<7;i++){const iso=fmtISO(days[i]);const isT=iso===todayISO;h+=`<div class="gh-day${isT?' today-h':''}"><div class="gh-dn">${dayNames[i]}</div><div class="gh-dd">${days[i].getDate()}</div></div>`;}
  h+='</div>';
  const types=[...new Set(EQUIPMENT.map(e=>e.type))];
  for(const type of types){
    for(const eq of EQUIPMENT.filter(e=>e.type===type)){
      h+=`<div class="grid-row"><div class="gr-lbl"><div class="gr-eq">${eq.id}</div><div class="gr-type">${eq.type}</div></div>`;
      for(let i=0;i<7;i++){
        const iso=fmtISO(days[i]);const isT=iso===todayISO;
        const hits=bookings.filter(b=>b.equipment===eq.id&&b.dateStart<=iso&&b.dateEnd>=iso);
        let inner='';
        if(hits.length===1){const b=hits[0];const mine=eng&&b.engineer===eng;inner=`<div class="chip ${mine?'c-mine':'c-full'}">${b.engineer.split('.')[0]}.<br>${b.timeStart}–${b.timeEnd}</div>`;}
        else if(hits.length===2){inner=hits.map(b=>{const mine=eng&&b.engineer===eng;const am=parseInt(b.timeStart)<12;return`<div class="chip ${mine?'c-mine':am?'c-am':'c-pm'}">${b.engineer.split('.')[0]}. ${b.timeStart}</div>`;}).join('');}
        else if(hits.length>2){inner=`<div class="chip c-warn">⚠${hits.length}</div>`;}
        h+=`<div class="gr-cell${isT?' today-c':''}" onclick="openCell('${eq.id}','${iso}')">${inner}</div>`;
      }
      h+='</div>';
    }
  }
  h+='</div></div>';return h;
}

async function doRefresh(){setBadge('⟳','#04c8b9');await loadBookings();renderCurrent();}

function buildBook(preEq='',preDate=''){
  const eng=document.getElementById('eng-global')?.value||'';
  const today=fmtISO(new Date());const d=preDate||today;
  const eqOpts=EQUIPMENT.map(e=>`<option value="${e.id}"${e.id===preEq?' selected':''}>${e.id}</option>`).join('');
  const zOpts=ZONES.map(z=>`<option value="${z}">${z}</option>`).join('');
  const engOpts=ENGINEERS.map(e=>`<option value="${e.name}"${e.name===eng?' selected':''}>${e.name} — ${e.title}</option>`).join('');
  const todayISO=fmtISO(new Date());
  const sbItems=EQUIPMENT.map(eq=>{const n=bookings.filter(b=>b.equipment===eq.id&&b.dateStart<=todayISO&&b.dateEnd>=todayISO).length;const dot=n===0?'#27A065':n===1?'#BA7517':'#E24B4A';return`<div class="eq-sb" onclick="document.getElementById('f-eq').value='${eq.id}';checkConflict()"><span class="eq-sb-name">${eq.id}</span><span class="eq-sb-dot" style="background:${dot}"></span></div>`;}).join('');
  return`<div class="book-wrap"><div class="book-panel">
    <div class="book-title">Шинэ захиалга</div>
    <div class="book-sub">${isOnline?'SharePoint EquipmentBookings2-д шууд хадгалагдана.':'⚠ Офлайн — дотооддоо хадгалагдана.'}</div>
    <div class="fg"><label class="fl">Захиалагч</label><select class="fs" id="f-eng"><option value="">Сонгоно уу...</option>${engOpts}</select></div>
    <div class="fg"><label class="fl">Тоног төхөөрөмж</label><select class="fs" id="f-eq" onchange="checkConflict()"><option value="">Сонгоно уу...</option>${eqOpts}</select></div>
    <div class="fg"><label class="fl">Байршил</label><select class="fs" id="f-zone"><option value="">Сонгоно уу...</option>${zOpts}</select></div>
    <div class="fg"><label class="fl">Эхлэх огноо · Цаг</label><div class="dt-row"><input type="date" class="fi" id="f-ds" value="${d}" onchange="checkConflict()"><div><div class="tg"><input type="text" class="ti" id="f-sh" value="08" maxlength="2"><span class="tsep">:</span><input type="text" class="ti" id="f-sm" value="00" maxlength="2"></div><div class="tlbl">цаг · мин</div></div></div></div>
    <div class="fg"><label class="fl">Дуусах огноо · Цаг</label><div class="dt-row"><input type="date" class="fi" id="f-de" value="${d}" onchange="checkConflict()"><div><div class="tg"><input type="text" class="ti" id="f-eh" value="17" maxlength="2"><span class="tsep">:</span><input type="text" class="ti" id="f-em" value="00" maxlength="2"></div><div class="tlbl">цаг · мин</div></div></div></div>
    <div class="fg"><label class="fl">Тайлбар</label><textarea class="fta" id="f-desc" placeholder="Ажлын тайлбар..."></textarea></div>
    <div class="alert a-warn" id="al-conflict"></div>
    <div class="alert a-ok" id="al-ok"></div>
    <div class="alert a-err" id="al-err"></div>
    <div class="alert a-info" id="al-info"></div>
    <div class="btn-row"><button class="btn-p" id="submit-btn" onclick="submitBooking()">Захиалга илгээх</button><button class="btn-g" onclick="show('schedule')">Буцах</button></div>
  </div>
  <div class="eq-sidebar"><div class="sb-title">Өнөөдрийн байдал</div>${sbItems}<div style="margin-top:10px;font-size:10px;color:#94a3b8;line-height:1.7">🟢 Чөлөөтэй<br>🟡 1 захиалга<br>🔴 2+</div></div></div>`;
}

function checkConflict(){
  const eq=document.getElementById('f-eq')?.value;const ds=document.getElementById('f-ds')?.value;const de=document.getElementById('f-de')?.value;
  const ac=document.getElementById('al-conflict');const ao=document.getElementById('al-ok');if(!ac)return;
  if(!eq||!ds||!de){ac.classList.remove('show');ao.classList.remove('show');return;}
  const hits=bookings.filter(b=>b.equipment===eq&&b.dateStart<=de&&b.dateEnd>=ds);
  if(hits.length>0){ac.innerHTML='⚠ '+eq+' захиалагдсан:<br>'+hits.map(b=>`<strong>${b.engineer}</strong> · ${b.zone} · ${b.timeStart}–${b.timeEnd}`).join('<br>');ac.classList.add('show');ao.classList.remove('show');}
  else if(eq){ao.innerHTML='✓ '+eq+' — давхцал байхгүй';ao.classList.add('show');ac.classList.remove('show');}
}

async function submitBooking(){
  const eng=document.getElementById('f-eng')?.value;const eq=document.getElementById('f-eq')?.value;const zone=document.getElementById('f-zone')?.value;
  const ds=document.getElementById('f-ds')?.value;const de=document.getElementById('f-de')?.value;
  const sh=(document.getElementById('f-sh')?.value||'08').padStart(2,'0');const sm=(document.getElementById('f-sm')?.value||'00').padStart(2,'0');
  const eh=(document.getElementById('f-eh')?.value||'17').padStart(2,'0');const em=(document.getElementById('f-em')?.value||'00').padStart(2,'0');
  const desc=document.getElementById('f-desc')?.value||'';
  const errEl=document.getElementById('al-err');const infoEl=document.getElementById('al-info');
  if(!eng||!eq||!zone||!ds||!de){if(errEl){errEl.innerHTML='⚠ Бүх талбарыг бөглөнө үү.';errEl.classList.add('show');}return;}
  if(parseInt(sh)>23||parseInt(eh)>23||parseInt(sm)>59||parseInt(em)>59){if(errEl){errEl.innerHTML='⚠ Цагийн формат буруу.';errEl.classList.add('show');}return;}
  if(de<ds){if(errEl){errEl.innerHTML='⚠ Огноо буруу.';errEl.classList.add('show');}return;}
  const btn=document.getElementById('submit-btn');if(btn){btn.disabled=true;btn.textContent='Хадгалж байна...';}
  if(errEl)errEl.classList.remove('show');
  const hasConflict=bookings.some(b=>b.equipment===eq&&b.dateStart<=de&&b.dateEnd>=ds);
  try{
    await createBooking({engineer:eng,equipment:eq,zone,dateStart:ds,dateEnd:de,timeStart:sh+':'+sm,timeEnd:eh+':'+em,description:desc,status:hasConflict?'Давхцал':'Хүлээгдэж буй'});
    if(infoEl){infoEl.innerHTML=isOnline?'✓ SharePoint-д хадгалагдлаа!':'✓ Дотооддоо хадгалагдлаа';infoEl.classList.add('show');}
    setTimeout(()=>show('list'),900);
  }catch(e){if(btn){btn.disabled=false;btn.textContent='Захиалга илгээх';}if(errEl){errEl.innerHTML='⚠ Алдаа: '+e.message;errEl.classList.add('show');}}
}

function buildList(){
  const engOpts=ENGINEERS.map(e=>`<option value="${e.name}">${e.name}</option>`).join('');
  const eqOpts=EQUIPMENT.map(e=>`<option value="${e.id}">${e.id}</option>`).join('');
  const statOpts=['Хүлээгдэж буй','Зөвшөөрсөн','Татгалзсан','Давхцал'].map(s=>`<option value="${s}">${s}</option>`).join('');
  const cards=buildCards(bookings);
  return`<div class="list-wrap"><div class="list-top">
    <select id="lf-eng" onchange="applyFilters()"><option value="">Бүх инженер</option>${engOpts}</select>
    <select id="lf-eq" onchange="applyFilters()"><option value="">Бүх техник</option>${eqOpts}</select>
    <select id="lf-stat" onchange="applyFilters()"><option value="">Бүх статус</option>${statOpts}</select>
    <button class="btn-p" onclick="show('book')" style="padding:6px 13px;font-size:11px">＋ Шинэ</button>
    <button class="refresh-btn" onclick="doRefresh()">↻</button>
    <span class="list-cnt" id="list-cnt">${bookings.length} захиалга</span>
  </div><div id="list-cards">${cards||'<div class="empty">Захиалга байхгүй байна.<br><button class="btn-p" style="margin-top:14px" onclick="show(\'book\')">Шинэ захиалга үүсгэх</button></div>'}</div></div>`;
}

function buildCards(list){
  if(!list.length)return'';
  const eng=document.getElementById('eng-global')?.value||'';const isChoi=eng==='Л.Далайжаргал';
  return[...list].sort((a,b)=>String(b.id).localeCompare(String(a.id))).map(b=>{
    const bc=b.status==='Зөвшөөрсөн'?'badge-a':(b.status==='Давхцал'||b.status==='Татгалзсан')?'badge-c':'badge-p';
    const days=Math.max(1,Math.round((new Date(b.dateEnd)-new Date(b.dateStart))/86400000)+1);
    return`<div class="bcard"><div class="bc-left"><div class="bc-badge ${bc}">${b.status}</div><div class="bc-time">${b.timeStart||''}–${b.timeEnd||''}</div>${isChoi&&b.status==='Хүлээгдэж буй'?`<button class="bc-approve" onclick="doApprove('${b.id}')">✓ Зөвш.</button>`:''}</div>
    <div class="bc-info"><div class="bc-eq">${b.equipment}</div><div class="bc-meta">${b.engineer} · ${b.dateStart} → ${b.dateEnd} (${days} өдөр)</div><div class="bc-zone">${b.zone}</div>${b.description?`<div class="bc-desc">${b.description}</div>`:''}</div>
    <button class="bc-del" onclick="doDel('${b.id}')">✕</button></div>`;
  }).join('');
}

function applyFilters(){
  const eng=document.getElementById('lf-eng')?.value||'';const eq=document.getElementById('lf-eq')?.value||'';const stat=document.getElementById('lf-stat')?.value||'';
  const filtered=bookings.filter(b=>(!eng||b.engineer===eng)&&(!eq||b.equipment===eq)&&(!stat||b.status===stat));
  const el=document.getElementById('list-cards');const cnt=document.getElementById('list-cnt');
  if(cnt)cnt.textContent=filtered.length+' захиалга';
  if(el)el.innerHTML=buildCards(filtered)||'<div class="empty">Шүүлтэд тохирох захиалга байхгүй.</div>';
}

async function doApprove(id){try{await updateStatus(id,'Зөвшөөрсөн');renderCurrent();}catch(e){alert('Алдаа: '+e.message);}}
async function doDel(id){if(!confirm('Устгах уу?'))return;try{await deleteBookingById(id);renderCurrent();}catch(e){alert('Алдаа: '+e.message);}}

function buildAI(){
  const msgs=chatHistory.length===0?[{role:'assistant',content:'Сайн байна уу. Тоног төхөөрөмжийн боломж, давхцал, хуваарийн талаар асуугаарай.\n\nЖишээ:\n· "Экскаватор-300 маргааш чөлөөтэй юу?"\n· "Энэ долоо хоногт давхцал байна уу?"\n· "Which equipment is free tomorrow morning?"'}]:chatHistory;
  return`<div class="ai-wrap"><div class="chat-msgs" id="chat-msgs">${msgs.map(m=>`<div class="msg msg-${m.role==='assistant'?'ai':'user'}"><div class="msg-lbl">${m.role==='assistant'?'AI туслах':'Та'}</div><div class="msg-bbl">${m.content.replace(/</g,'&lt;')}</div></div>`).join('')}</div>
  <div class="chat-foot"><input class="chat-in" id="chat-in" placeholder="Асуулт бичнэ үү... (МН/EN)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"><button class="chat-send" onclick="sendChat()">↑</button></div></div>`;
}

async function sendChat(){
  const inp=document.getElementById('chat-in');if(!inp)return;
  const msg=inp.value.trim();if(!msg)return;inp.value='';
  chatHistory.push({role:'user',content:msg});renderCurrent();
  setTimeout(()=>{const el=document.getElementById('chat-msgs');if(el)el.scrollTop=el.scrollHeight;},30);
  const days=getWeekDays(weekOffset);const dayNames=['Да','Мя','Лх','Пү','Ба','Бя','Ня'];
  const schedData=EQUIPMENT.map(eq=>{const row=days.map((d,i)=>{const hits=bookings.filter(b=>b.equipment===eq.id&&b.dateStart<=fmtISO(d)&&b.dateEnd>=fmtISO(d));return hits.length===0?`${dayNames[i]}:чөлөөтэй`:hits.map(h=>`${dayNames[i]}:${h.engineer.split('.')[0]}(${h.timeStart}-${h.timeEnd})`).join(' ');}).join(' ');return`${eq.id}: ${row}`;}).join('\n');
  const msgsEl=document.getElementById('chat-msgs');
  if(msgsEl){const t=document.createElement('div');t.className='msg msg-ai';t.id='typing-ind';t.innerHTML='<div class="msg-lbl">AI туслах</div><div class="msg-bbl"><div class="typing"><span></span><span></span><span></span></div></div>';msgsEl.appendChild(t);msgsEl.scrollTop=msgsEl.scrollHeight;}
  const system=`Та Монголын барилгын талбайн тоног төхөөрөмж захиалгын AI туслах юм. Компани: Монкон Констракшн. Төсөл: 25 блок, 4×22 давхар, 2 сургууль, 1 спортын цогцолбор.
Техник: ${EQUIPMENT.map(e=>e.id).join(', ')}. Байршил: ${ZONES.join(', ')}.
Одоогийн хуваарь (${getISOWeek(days[0])}-р долоо хоног):\n${schedData}
Нийт захиалга (${bookings.length}):\n${bookings.length?bookings.map(b=>`${b.equipment}|${b.engineer}|${b.zone}|${b.dateStart} ${b.timeStart}->${b.dateEnd} ${b.timeEnd}|${b.status}`).join('\n'):'байхгүй'}
Монгол болон англи хэлээр хариулах. Шууд, товч.`;
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system,messages:chatHistory.slice(0,-1).concat([{role:'user',content:msg}])})});
    const data=await r.json();const reply=data.content?.find(c=>c.type==='text')?.text||'Хариу байхгүй.';
    document.getElementById('typing-ind')?.remove();chatHistory.push({role:'assistant',content:reply});renderCurrent();
    setTimeout(()=>{const el=document.getElementById('chat-msgs');if(el)el.scrollTop=el.scrollHeight;},30);
  }catch(e){document.getElementById('typing-ind')?.remove();chatHistory.push({role:'assistant',content:'Алдаа: '+e.message});renderCurrent();}
}

function openCell(eqId,iso){currentView='book';['schedule','book','list','ai'].forEach(t=>document.getElementById('tab-'+t).classList.toggle('active',t==='book'));document.getElementById('content').innerHTML=buildBook(eqId,iso);setTimeout(checkConflict,60);}
function postRender(){const cm=document.getElementById('chat-msgs');if(cm)cm.scrollTop=cm.scrollHeight;}

async function init(){
  initEngDropdown();
  bookings=lsLoad();
  renderCurrent();
  await loadBookings();
  renderCurrent();
}
init();
</script>
